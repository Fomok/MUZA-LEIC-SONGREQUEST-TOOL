<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Song Bot Overlay</title>
<style>
  /* Transparent page for an OBS Browser Source. Suggested source size: 480 x 140. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #card {
    display: flex; align-items: center; gap: 14px;
    box-sizing: border-box; width: 460px; padding: 12px 16px; margin: 10px;
    background: rgba(15, 17, 21, 0.88);
    border: 1px solid rgba(124, 92, 255, 0.55);
    border-radius: 14px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e6e9ef;
    opacity: 0; transform: translateY(12px);
    transition: opacity .45s ease, transform .45s ease;
  }
  #card.show { opacity: 1; transform: translateY(0); }
  #thumb {
    width: 84px; height: 47px; object-fit: cover; border-radius: 8px; flex: none;
    background: #1e2229;
  }
  #info { min-width: 0; flex: 1; }
  #label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: #9d86ff;
  }
  #title {
    font-size: 15.5px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #by {
    font-size: 12px; color: #8b93a3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #paused { color: #f5c451; font-weight: 700; }
  #bar-track {
    height: 4px; margin-top: 7px; border-radius: 2px; overflow: hidden;
    background: rgba(255, 255, 255, 0.16);
  }
  #bar-fill {
    height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, #7c5cff, #9d86ff);
    transition: width .25s linear;
  }
  /* ?clean=1 — no card background: just thumbnail, text, progress bar */
  body.clean #card { background: transparent; border-color: transparent; }
  body.clean #title, body.clean #label { text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  body.clean #by { text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  body.clean #bar-track { background: rgba(0, 0, 0, 0.45); }
</style>
</head>
<body>
  <div id="card">
    <img id="thumb" alt="">
    <div id="info">
      <div id="label">♪ NOW PLAYING <span id="paused"></span></div>
      <div id="title"></div>
      <div id="by"></div>
      <div id="bar-track"><div id="bar-fill"></div></div>
    </div>
  </div>

<script>
const card = document.getElementById('card');
let lastId = null;
let durationSec = null;
let basePos = null; // last known position from the server
let baseAt = 0; // when we learned it
let isPaused = false;

if (new URLSearchParams(location.search).get('clean') === '1') {
  document.body.classList.add('clean');
}

// advance the bar smoothly between polls
setInterval(() => {
  const fill = document.getElementById('bar-fill');
  if (basePos == null || !durationSec) {
    fill.style.width = '0%';
    return;
  }
  const pos = isPaused ? basePos : basePos + (Date.now() - baseAt) / 1000;
  fill.style.width = Math.min(100, (pos / durationSec) * 100).toFixed(2) + '%';
}, 250);

async function tick() {
  try {
    const r = await fetch('/api/now', { cache: 'no-store' });
    const s = await r.json();
    if (!s.current) {
      card.classList.remove('show');
      lastId = null;
      basePos = null;
      return;
    }
    document.getElementById('paused').textContent = s.paused ? '· PAUSED' : '';
    isPaused = s.paused;
    durationSec = s.current.durationSec || null;
    if (s.positionSec != null) {
      basePos = s.positionSec;
      baseAt = Date.now();
    } else if (s.current.id !== lastId) {
      basePos = 0; // new song, position unknown yet — start from the beginning
      baseAt = Date.now();
    }
    if (s.current.id !== lastId) {
      lastId = s.current.id;
      // brief dip so the change animates
      card.classList.remove('show');
      setTimeout(() => {
        document.getElementById('thumb').src =
          'https://i.ytimg.com/vi/' + encodeURIComponent(s.current.id) + '/mqdefault.jpg';
        document.getElementById('title').textContent = s.current.title;
        document.getElementById('by').textContent =
          s.current.source === 'fallback' ? 'auto playlist' : 'requested by ' + (s.current.requestedBy || '?');
        card.classList.add('show');
      }, 350);
    } else {
      card.classList.add('show');
    }
  } catch {
    card.classList.remove('show');
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
