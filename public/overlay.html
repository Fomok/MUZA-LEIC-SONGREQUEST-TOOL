<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Song Bot Overlay</title>
<style>
  /* Transparent page for an OBS Browser Source.
     Renders at 2x by default — set the OBS source to 960 x 280.
     ?scale=1..4 changes the render scale (multiply 480 x 140 accordingly). */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #card {
    display: flex; align-items: center; gap: 14px;
    box-sizing: border-box; width: 460px; padding: 12px 16px; margin: 10px;
    background: rgba(15, 17, 21, 0.88);
    border: 1px solid rgba(124, 92, 255, 0.55);
    border-radius: 14px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e6e9ef;
    opacity: 0; transform: translateY(12px);
    transition: opacity .45s ease, transform .45s ease;
  }
  #card.show { opacity: 1; transform: translateY(0); }
  #thumb {
    width: 84px; height: 47px; object-fit: cover; border-radius: 8px; flex: none;
    background: #1e2229;
  }
  #info { min-width: 0; flex: 1; }
  #label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: #9d86ff;
  }
  #title {
    font-size: 15.5px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #by {
    font-size: 12px; color: #8b93a3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #paused { color: #f5c451; font-weight: 700; }
  #bar-track {
    height: 4px; margin-top: 7px; border-radius: 2px; overflow: hidden;
    background: rgba(255, 255, 255, 0.16);
  }
  #bar-fill {
    height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, #7c5cff, #9d86ff);
    transition: width .25s linear;
  }
  /* ?clean=1 — no card background: just thumbnail, text, progress bar */
  body.clean #card { background: transparent; border-color: transparent; }
  body.clean #title, body.clean #label { text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  body.clean #by { text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  body.clean #bar-track { background: rgba(0, 0, 0, 0.45); }
</style>
</head>
<body>
  <div id="card">
    <img id="thumb" alt="">
    <div id="info">
      <div id="label">♪ NOW PLAYING <span id="paused"></span></div>
      <div id="title"></div>
      <div id="by"></div>
      <div id="bar-track"><div id="bar-fill"></div></div>
    </div>
  </div>

<script>
const card = document.getElementById('card');
let lastId = null;
let durationSec = null;
let isPaused = false;

const params = new URLSearchParams(location.search);
if (params.get('clean') === '1') {
  document.body.classList.add('clean');
}
// Render at 2x by default so OBS scales DOWN (sharp), not up (pixelated).
// Set the OBS source to 960x280 (or 480x140 per 1x of ?scale=).
const scale = Math.max(1, Math.min(4, parseFloat(params.get('scale')) || 2));
document.body.style.zoom = scale;

// The bar glides between server readings via CSS transitions — anchored to the
// engine's clock every poll, so it cannot drift and never wobbles backwards.
// Video-player-style sync: draw every rendered frame from a local wall-clock,
// and correct the clock's SPEED (not its position) toward the server's readings.
// Motion never stops and never jumps, except on a real seek or song change.
const fillEl = document.getElementById('bar-fill');
fillEl.style.transition = 'none';

let anchorPos = 0; // song position at the anchor moment
let anchorAt = 0; // wall-clock ms of the anchor
let rate = 1.0; // local clock speed (0.92..1.08)
let haveAnchor = false;

function localPos() {
  if (!haveAnchor) return 0;
  if (isPaused) return anchorPos;
  return anchorPos + ((Date.now() - anchorAt) / 1000) * rate;
}

function reAnchor(pos) {
  anchorPos = pos;
  anchorAt = Date.now();
}

function updateBar(serverPos, songChanged) {
  if (!durationSec) {
    haveAnchor = false;
    return;
  }
  if (serverPos == null) return; // keep gliding on the local clock
  if (songChanged || !haveAnchor || Math.abs(serverPos - localPos()) > 3) {
    // new song or a real seek — the one place we jump
    reAnchor(serverPos);
    rate = 1.0;
    haveAnchor = true;
    return;
  }
  // measure drift and steer the clock speed toward the server, never the position
  const err = localPos() - serverPos; // + means we run ahead
  reAnchor(localPos());
  rate = 1.0 - Math.max(-0.08, Math.min(0.08, err * 0.08));
}

// draw loop — tied to the renderer's frame rate, which OBS does not throttle
(function draw() {
  if (haveAnchor && durationSec) {
    const pos = Math.min(localPos(), durationSec);
    fillEl.style.width = Math.min(100, Math.max(0, (pos / durationSec) * 100)).toFixed(3) + '%';
  } else {
    fillEl.style.width = '0%';
  }
  requestAnimationFrame(draw);
})();

// pause must freeze the local clock exactly where it is
function notePause(paused) {
  if (paused === isPaused) return;
  reAnchor(localPos()); // freeze/unfreeze from the current spot
  isPaused = paused;
}

async function tick() {
  try {
    const r = await fetch('/api/now', { cache: 'no-store' });
    const s = await r.json();
    if (!s.current) {
      card.classList.remove('show');
      lastId = null;
      haveAnchor = false;
      return;
    }
    document.getElementById('paused').textContent = s.paused ? '· PAUSED' : '';
    durationSec = s.current.durationSec || null;
    const songChanged = s.current.id !== lastId;
    if (songChanged) isPaused = s.paused;
    else notePause(s.paused);
    updateBar(s.positionSec ?? (songChanged ? 0 : null), songChanged);
    if (s.current.id !== lastId) {
      lastId = s.current.id;
      // brief dip so the change animates
      card.classList.remove('show');
      setTimeout(() => {
        document.getElementById('thumb').src =
          'https://i.ytimg.com/vi/' + encodeURIComponent(s.current.id) + '/hqdefault.jpg';
        document.getElementById('title').textContent = s.current.title;
        document.getElementById('by').textContent =
          s.current.source === 'fallback' ? 'auto playlist' : 'requested by ' + (s.current.requestedBy || '?');
        card.classList.add('show');
      }, 350);
    } else {
      card.classList.add('show');
    }
  } catch {
    card.classList.remove('show');
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
