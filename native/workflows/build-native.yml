name: Build native Windows app

on:
  workflow_dispatch: {}
  push:
    tags: ["native-v*"]

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine dependencies (no dev deps)
        run: npm install --omit=dev

      - name: Assemble engine folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage\engine | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp
          Copy-Item nodetmp\node-v22.14.0-win-x64\node.exe stage\engine\
          Copy-Item -Recurse src stage\engine\src
          Copy-Item -Recurse public stage\engine\public
          Copy-Item package.json stage\engine\
          Copy-Item -Recurse node_modules stage\engine\node_modules

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build GUI
        run: dotnet publish native/SongBot.Gui/SongBot.Gui.csproj -c Release -r win-x64 --self-contained true -o gui-out

      - name: Stage GUI next to engine
        shell: pwsh
        run: |
          Copy-Item gui-out\* stage\ -Recurse -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" native\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: song-bot-native-windows
          path: dist-native/*.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-native/*.exe
